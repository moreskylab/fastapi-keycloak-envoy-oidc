# =============================================================================
# CI: Build, Sign, Push — OCI Artifacts (Factor V: Build/Release/Run)
# =============================================================================
# Runs on merge to main. Builds multi-arch images, scans with Trivy,
# signs with cosign (keyless), pushes to Nexus OCI registry.
# =============================================================================

name: CI — Build & Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write  # For OIDC auth to Nexus + cosign keyless signing

env:
  REGISTRY: nexus.internal
  BACKEND_IMAGE: fastapi-oidc/backend
  FRONTEND_IMAGE: fastapi-oidc/frontend

jobs:
  build-backend:
    name: "Build: Backend Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          exit-code: 1

      - name: Push to registry
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Sign with cosign (keyless)
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    name: "Build: Frontend Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign with cosign
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  helm-package:
    name: "Helm: Package & Push OCI"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@v4
      - run: |
          helm package helm/fastapi-oidc-app/ --version 0.1.0-${{ github.sha }}
          helm push fastapi-oidc-app-*.tgz oci://${{ env.REGISTRY }}/helm

  update-manifests:
    name: "GitOps: Update Image Tags"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in values
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|g" helm/fastapi-oidc-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/fastapi-oidc-app/values.yaml
          git commit -m "chore: update image tags to ${{ github.sha }}" || true
          git push
