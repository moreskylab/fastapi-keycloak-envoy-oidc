apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oidc-routes
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: oidc-gateway
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    # Public API — no auth required
    - matches:
        - path:
            type: PathPrefix
            value: /api/public
      backendRefs:
        - name: backend
          port: {{ .Values.backend.port }}
    # Health probes — no auth required
    - matches:
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: backend
          port: {{ .Values.backend.port }}
    # Secure API — JWT validated by SecurityPolicy
    - matches:
        - path:
            type: PathPrefix
            value: /api/secure
      backendRefs:
        - name: backend
          port: {{ .Values.backend.port }}
    # Frontend SPA
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: {{ .Values.frontend.port }}
