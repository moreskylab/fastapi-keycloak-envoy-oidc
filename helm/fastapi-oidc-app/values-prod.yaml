# Production environment overrides
global:
  imageRegistry: nexus.internal

backend:
  replicas: 3
  env:
    LOG_LEVEL: WARNING
    ENVIRONMENT: prod
    CORS_ORIGIN: https://app.example.com
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

keycloak:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

postgres:
  storage:
    size: 20Gi

gateway:
  host: "api.example.com"
  tls:
    enabled: true
    secretName: api-tls-secret

externalSecrets:
  enabled: true
  refreshInterval: 1h

pdb:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilization: 60
